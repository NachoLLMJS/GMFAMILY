name: Refresh GMGN snapshots

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmfamily-hourly-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh persistent public snapshots
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- data/migrated-tokens.json data/paper-trading.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/migrated-tokens.json data/paper-trading.json
          git commit -m "chore: refresh hourly GMGN snapshots"
          git push
